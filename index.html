<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frikilandia</title>
  <link rel="stylesheet" href="style.css">
  <script src="carrito.js"></script>
</head>
<body>

  <header class="cabeceraTienda">
    <h1>Frikilandia</h1>
  </header>

  <main class="contenedorPrincipal">

    <section class="seccionProductos">
      <table class="tablaProductos">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Pr. Unidad</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="listaProductos"></tbody>
      </table>
    </section>

    <aside class="panelTotal">
      <h2>Carrito</h2>
      <div id="resumenProductos"></div>
      <hr>
      <div class="filaTotal">
        <p>TOTAL</p>
        <p id="precioTotal">0.00€</p>
      </div>
    </aside>

  </main>

  
</body>
</html>
